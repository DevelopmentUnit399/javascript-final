<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Info</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/66e0a4dc21.js" crossorigin="anonymous"></script>
</head>
<body>
    <section class="landing-page">
        <div class="nav row">
            <figure>
                <img src="assets/images/main-logo.png" alt="" class="personal-logo">
                <h2 class="personal-text">Movies</h2>
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect">Home</a>
                </li>
                <li class="nav__link">
                    <a href="" class="
                    nav__link--anchor
                    link__hover-effect">Find Your Movie</a>
                </li>
                <li class="nav__link">
                    <button class="
                    nav__link--anchor
                    link__hover-effect
                    nav__link--primary
                    no__effect
                    no__click">Contact</button>
                </li>
            </ul>
        </div>
        <header class="header">
            <div class="header__content row">
                <h1 class="title">Welcome to the best place for <b class="highlight">movies!</b></h1>
                <h2 class="header__para">Find your favorite movies <b class="highlight">here!</b></h2>
            </div>
            <div class="header__search row">
                <input type="text" class="input" placeholder="Search by Movie title, year, or type.">
                <div class="header__btn">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
        </header>

        <div class="row">
            <img src="assets/images/movie-background.jpg" alt="" class="movie__background">
        </div>
    </section>

    <footer class="footer">
        <div class="row footer__row">
            <figure>
                <img src="assets/images/main-logo.png" alt="" class="footer__logo--img">
                <h2 class="personal-text">Movies</h2>
            </figure>

            <div class="footer__nav">
                <div class="footer__nav--list">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect">Home</a>
                </div>
                <div class="footer__nav--list">
                    <a href="#" class="nav__link--anchor
                    link__hover-effect">Find Your Movie</a>
                </div>
                <div class="footer__nav--list">
                    <button class="nav__link--anchor
                    link__hover-effect
                    nav__link--primary
                    footer__nav--primary">Contact</button>
                </div>
            </div>

            <div class="footer__copyright">Copyright © 2026 Garrett Uichanco</div>
        </div>
    </footer>

</body>
</html>
