<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <link rel="stylesheet" href="style.css">
    <script src="movies.js" defer></script>
    <script src="https://kit.fontawesome.com/66e0a4dc21.js" crossorigin="anonymous"></script>
</head>
<body>
    <section class="landing-page landing-page--movies">

        <div class="background">
            <img src="assets/images/movie-posters.jpg" alt="" class="background__img">
        </div>

        <div class="nav row">
            <figure>
                <img src="assets/images/main-logo.png" alt="" class="personal-logo">
                <h2 class="personal-text">Movies</h2>
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link">
                    <a href="#" class="
                    nav__link--anchor
                    link__hover-effect">Home</a>
                </li>
                <li class="nav__link">
                    <a href="" class="
                    nav__link--anchor
                    link__hover-effect">Find Your Movie</a>
                </li>
                <li class="nav__link">
                    <button class="
                    nav__link--anchor
                    link__hover-effect
                    nav__link--primary
                    no__effect
                    no__click">Contact</button>
                </li>
            </ul>
        </div>

        <header class="header header--movies">
            <div class="header__content row">
                <h1 class="title">Browse Our Movies</h1>
                <div class="header__content--main">
                    <div class="header__search header__search--movies">
                        <input class="header__search--input" type="text" placeholder="Search by Movie title, year, or type." onchange="onSearchChange(event)">
                        <button class="header__search--icon click">
                            <i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                </div>
            </div>
        </header>
    </section>

    <section class="search__results">
            <div class="row white__row">
                <div class="results__titles">
                    <h2 class="results__title">Search results for: </h2>
                    <h2 class="results__search highlight">"2026"</h2>
                </div>
            </div>
        </div>
    </section>

    <section class="movie__card">
        <div class="row">
            <div class="cards">

                </div>

            </div>
        </div>
    </section>
</body>
</html>
